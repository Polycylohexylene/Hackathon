name: Build application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install GitPython pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --onefile --windowed --name DocumentEditor editor.py

      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\DocumentEditor
          Copy-Item dist\DocumentEditor.exe package\DocumentEditor\
          Compress-Archive `
            -Path package\DocumentEditor `
            -DestinationPath DocumentEditor-Windows.zip

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DocumentEditor-Windows
          path: DocumentEditor-Windows.zip

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk git zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install GitPython pyinstaller

      - name: Build Linux executable
        run: |
          pyinstaller --onefile --windowed --name DocumentEditor editor.py

      - name: Create ZIP
        run: |
          mkdir -p package/DocumentEditor
          cp dist/DocumentEditor package/DocumentEditor/
          chmod +x package/DocumentEditor/DocumentEditor
          zip -r DocumentEditor-Linux.zip package/DocumentEditor

      - name: Upload Linux ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DocumentEditor-Linux
          path: DocumentEditor-Linux.zip
