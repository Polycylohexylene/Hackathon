<style>

;color:var(--muted);line-height:1.4}.workspace{overflow:hidden}.workspace-header{min-height:58px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}.workspace-header>div{display:flex;gap:9px;align-items:center}.workspace-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.author-chip{font-size:.76rem;color:#65718a;background:#f4f6f8;border:1px solid #e0e5eb;border-radius:999px;padding:5px 9px}.author-chip strong{color:#344054}.status-pill{border-radius:999px;padding:5px 9px;background:#edf7ee;color:#216e39;font-size:.76rem;font-weight:760}.status-pill.dirty{background:#fff5df;color:#8a5700}#editor{display:block;width:100%;min-height:470px;resize:vertical;border:0;outline:none;padding:18px;line-height:1.58;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:.96rem;color:#162033}.statusbar{display:flex;justify-content:space-between;gap:20px;padding:10px 16px;background:#fafbfc;border-top:1px solid var(--border);color:var(--muted);font-size:.76rem}#commitHash{font-family:monospace}dialog{border:0;padding:0;border-radius:16px;box-shadow:0 28px 70px rgba(0,0,0,.24);color:inherit}dialog::backdrop{background:rgba(9,15,30,.55);backdrop-filter:blur(2px)}.dialog-card{width:min(520px,calc(100vw - 32px));display:grid;gap:14px;padding:20px}.dialog-heading{display:flex;align-items:start;justify-content:space-between;gap:20px}.icon-button{padding:3px 10px;font-size:1.45rem;line-height:1;border:0;background:transparent;color:#647087}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:4px}.history-dialog{width:min(1120px,calc(100vw - 30px));height:min(760px,calc(100vh - 30px))}.history-shell{height:100%;display:grid;grid-template-rows:auto 1fr auto}.history-heading{padding:18px 20px;border-bottom:1px solid var(--border)}.history-grid{min-height:0;display:grid;grid-template-columns:minmax(270px,.9fr) minmax(0,2.1fr)}.commit-list-panel{bord <body>
<header class="topbar"><div><p class="eyebrow">LOCAL-FIRST VERSIONING</p><h1>Git Document Editor</h1></div></header>
<div id="startupError" class="startup-error"></div>
<main class="page-shell">
<section class="toolbar card" aria-label="Document controls"><div class="button-row"><button id="historyBtn">View history</button></div><div class="button-row secondary-actions"><button id="openFolderBtn">Import repository ZIP</button><button id="exportFolderBtn" class="primary">Commit &amp; Export repository ZIP</button></div></section>
<section class="workspace card"><div class="workspace-header"><div><span class="label">Editing</span><strong>document.txt</strong></div><div class="workspace-meta"><span class="author-chip">Author name: <strong id="authorDisplay">Detecting…</strong></span><span id="dirtyBadge" class="status-pill">Saved</span></div></div><textarea id="editor" spellcheck="true" aria-label="Document editor"></textarea><div class="statusbar"><span id="statusText">Starting local repository…</span><span id="commitHash"></span></div></section>
</main>
<dialog id="historyDialog" class="history-dialog"><div class="history-shell"><div class="dialog-heading history-heading"><div><p class="eyebrow">GIT HISTORY</p><h2>Previous versions</h2></div><button id="closeHistoryBtn" class="icon-button" aria-label="Close">×</button></div><div class="history-grid"><aside class="commit-list-panel"><div id="commitList" class="commit-list"></div></aside><section class="diff-panel"><div id="selectedCommitMeta" class="selected-meta">Select a version to inspect it.</div><div class="diff-legend"><span><i class="legend-dot added"></i>Added in current editor</span><span><i class="legend-dot removed"></i>Removed from selected version</span></div><pre id="diffPreview" class="diff-preview"></pre></section></div><div class="dialog-actions history-actions"><button id="loadVersionBtn" disabled>Load selected version into editor</button><button id="doneHistoryBtn" class="primary">Done</button></div></div></dialog>
<div id="toastRegion" class="toast-region" aria-live="polite"></div>
<input id="zipImportInput" type="file" accept=".zip,application/zip" hidden />
<script>
(() => {
'use strict';
const STORAGE_KEY='gitdoc.selfcontained.v1';
const NAME_KEY='gitdoc.authorName';
const EMAIL_KEY='gitdoc.authorEmail';
const enc=new TextEncoder(); const dec=new TextDecoder('utf-8');
const $=s=>document.querySelector(s);
const ui={editor:$('#editor'),historyBtn:$('#historyBtn'),openFolderBtn:$('#openFolderBtn'),exportFolderBtn:$('#exportFolderBtn'),authorDisplay:$('#authorDisplay'),statusText:$('#statusText'),commitHash:$('#commitHash'),dirtyBadge:$('#dirtyBadge'),historyDialog:$('#historyDialog'),closeHistoryBtn:$('#closeHistoryBtn'),doneHistoryBtn:$('#doneHistoryBtn'),commitList:$('#commitList'),selectedCommitMeta:$('#selectedCommitMeta'),diffPreview:$('#diffPreview'),loadVersionBtn:$('#loadVersionBtn'),toastRegion:$('#toastRegion'),startupError:$('#startupError'),zipImportInput:$('#zipImportInput')};
let state={commits:[],headOid:'',workingText:''}; let dirty=false; let selected=null;
function toast(msg,kind='info'){const n=document.createElement('div');n.className='toast '+kind;n.textContent=msg;ui.toastRegion.appendChild(n);setTimeout(()=>n.remove(),3600)}
function status(msg,oid=''){ui.statusText.textContent=msg;ui.commitHash.textContent=oid?'HEAD '+oid.slice(0,10):''}
function setDirty(v){dirty=v;ui.dirtyBadge.textContent=v?'Uncommitted changes':'Saved';ui.dirtyBadge.classList.toggle('dirty',v)}
function concat(...parts){const len=parts.reduce((n,p)=>n+p.length,0),out=new Uint8Array(len);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}

function bytesToHex(bytes){return [...bytes].map(b=>b.toString(16).padStart(2,'0')).join('')}
function b64(bytes){let s='';for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(s)}
function unb64(s){const bin=atob(s),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
async function sha1(bytes){return new Uint8Array(await crypto.subtle.digest('SHA-1',bytes))}
async function objectData(type,payload){const full=concat(enc.encode(type+' '+payload.length+'\0'),payload);return{oid:bytesToHex(await sha1(full)),full}}
async function compress(bytes){const cs=new CompressionStream('deflate');return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer())}
async function decompress(bytes){const ds=new DecompressionStream('deflate');return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer())}
function tzOffset(){const mins=-new Date().getTimezoneOffset(),sign=mins>=0?'+':'-',a=Math.abs(mins);return sign+String(Math.floor(a/60)).padStart(2,'0')+String(a%60).padStart(2,'0')}
let detectedAuthorName='Local user';
function detectComputerUser(){
  let path='';
  try{path=decodeURIComponent(location.pathname||'')}catch{path=location.pathname||''}
  const patterns=[/\/Users\/([^/]+)/i,/\/home\/([^/]+)/i,/^[A-Za-z]:\\Users\\([^\\]+)/i];
  for(const re of patterns){const m=path.match(re);if(m&&m[1])return m[1].replace(/[<>\n\r]/g,'').trim()}
  const previous=(localStorage.getItem(NAME_KEY)||'').replace(/[<>\n\r]/g,'').trim();
  return previous||'Local user';
}
function identity(){const name=(detectedAuthorName||'Local user').replace(/[<>\n\r]/g,'').trim()||'Local user';const email=(name.toLowerCase().replace(/[^a-z0-9._-]+/g,'.').replace(/^\.+|\.+$/g,'')||'local-user')+'@local.invalid';return{name,email}}
function saveState(){state.workingText=ui.editor.value;localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function loadStored(){detectedAuthorName=detectComputerUser();ui.authorDisplay.textContent=detectedAuthorName;localStorage.setItem(NAME_KEY,detectedAuthorName);const raw=localStorage.getItem(STORAGE_KEY);if(raw){try{state=JSON.parse(raw)}catch{localStorage.removeItem(STORAGE_KEY)}}}

function fmt(ts){return new Intl.DateTimeFormat(undefined,{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(ts*1000))}
function lineDiff(oldText,newText){const a=oldText.split(/(?<=\n)/),b=newText.split(/(?<=\n)/),rows=a.length+1,cols=b.length+1,lcs=Array.from({length:rows},()=>new Uint32Array(cols));for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)lcs[i][j]=a[i]===b[j]?lcs[i+1][j+1]+1:Math.max(lcs[i+1][j],lcs[i][j+1]);const out=[];let i=0,j=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){out.push({type:'same',text:a[i++]});j++}else if(lcs[i+1][j]>=lcs[i][j+1])out.push({type:'removed',text:a[i++]});else out.push({type:'added',text:b[j++]})}while(i<a.length)out.push({type:'removed',text:a[i++]});while(j<b.length)out.push({type:'added',text:b[j++]});return out}
function renderDiff(diff){ui.diffPreview.replaceChildren();for(const p of diff){if(!p.text)continue;const s=document.createElement('span');s.className='diff-line '+p.type;s.textContent=(p.type==='added'?'+ ':p.type==='removed'?'- ':'  ')+p.text+(p.text.endsWith('\n')?'':'\n');ui.diffPreview.appendChild(s)}}
function showHistory(){ui.commitList.replaceChildren();selected=null;ui.loadVersionBtn.disabled=true;ui.diffPreview.textContent='';ui.selectedCommitMeta.textContent='Select a version to inspect it.';const newest=[...state.commits].reverse();newest.forEach((c,index)=>{const b=document.createElement('button');b.className='commit-item';const num=document.createElement('span');num.className='commit-number';num.textContent=String(index+1);const main=document.createElement('span');main.className='commit-main';const strong=document.createElement('strong');strong.textContent=c.message||'(no message)';const small=document.createElement('small');small.textContent=(c.author?.name||'Unknown user')+' · '+fmt(c.timestamp);main.append(strong,small);const code=document.createElement('code');code.textContent=c.oid.slice(0,8);b.append(num,main,code);b.addEventListener('click',()=>{ui.commitList.querySelectorAll('.selected').forEach(n=>n.classList.remove('selected'));b.classList.add('selected');selected=c;ui.selectedCommitMeta.textContent=c.oid.slice(0,10)+' · '+(c.author?.name||'Unknown user')+' · '+c.message;renderDiff(lineDiff(c.content,ui.editor.value));ui.loadVersionBtn.disabled=false});ui.commitList.appendChild(b)});ui.historyDialog.showModal();ui.commitList.querySelector('.commit-item')?.click()}
async function getDir(root,parts,create=false){let h=root;for(const p of parts)h=await h.getDirectoryHandle(p,{create});return h}
async function writeFile(root,path,bytes){const parts=path.split('/').filter(Boolean),name=parts.pop(),dir=await getDir(root,parts,true),fh=await dir.getFileHandle(name,{create:true}),w=await fh.createWritable();await w.write(bytes instanceof Uint8Array?bytes:enc.encode(String(bytes)));await w.close()}
async function readFile(root,path){const parts=path.split('/').filter(Boolean),name=parts.pop(),dir=await getDir(root,parts,false),fh=await dir.getFileHandle(name),f=await fh.getFile();return new Uint8Array(await f.arrayBuffer())}
async function clearDir(h){for await(const [name] of h.entries())await h.removeEntry(name,{recursive:true})}
async function writeLoose(gitDir,type,payload,expectedOid){const obj=await objectData(type,payload);if(expectedOid&&obj.oid!==expectedOid)throw new Error('Git object hash mismatch while exporting '+expectedOid);const packed=await compress(obj.full);await writeFile(gitDir,'objects/'+obj.oid.slice(0,2)+'/'+obj.oid.slice(2),packed)}
function be32(n){return new Uint8Array([(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255])}
async function makeIndex(blobOid,size){const name=enc.encode('document.txt'),fixed=[];for(let i=0;i<10;i++)fixed.push(be32(i===6?0x000081a4:(i===9?size:0)));const flags=new Uint8Array([0,name.length&255]);let entry=concat(...fixed,hexToBytes(blobOid),flags,name,new Uint8Array([0]));const pad=(8-(entry.length%8))%8;entry=concat(entry,new Uint8Array(pad));const body=concat(enc.encode('DIRC'),be32(2),be32(1),entry);return concat(body,await sha1(body))}
function le16(n){return new Uint8Array([n&255,(n>>>8)&255])}
function le32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
function read16(b,o){return b[o]|(b[o+1]<<8)}
function read32(b,o){return (b[o]|(b[o+1]<<8)|(b[o+2]<<16)|(b[o+3]<<24))>>>0}
const crcTable=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();

function dosTimeDate(d=new Date()){let year=Math.max(1980,d.getFullYear());return{time:(d.getHours()<<11)|(d.getMinutes()<<5)|Math.floor(d.getSeconds()/2),date:((year-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()}}

async function buildRepoFiles(){const files=new Map();files.set('document.txt',enc.encode(ui.editor.value));files.set('.git/HEAD',enc.encode('ref: refs/heads/main\n'));files.set('.git/config',enc.encode('[core]\n\trepositoryformatversion = 0\n\tfilemode = false\n\tbare = false\n\tlogallrefupdates = true\n'));files.set('.git/description',enc.encode('Local Git Document Editor repository\n'));const seen=new Set();for(const c of state.commits){for(const [type,oid,raw] of [['blob',c.blobOid,c.blobRaw],['tree',c.treeOid,c.treeRaw],['commit',c.oid,c.commitRaw]]){if(seen.has(oid))continue;const obj=await objectData(type,unb64(raw));if(obj.oid!==oid)throw new Error('Git object hash mismatch: '+oid);files.set('.git/objects/'+oid.slice(0,2)+'/'+oid.slice(2),await compress(obj.full));seen.add(oid)}}const head=state.commits[state.commits.length-1];files.set('.git/refs/heads/main',enc.encode(head.oid+'\n'));files.set('.git/index',await makeIndex(head.blobOid,enc.encode(head.content).length));return files}
async function exportRepoZip(){const head=state.commits[state.commits.length-1];let committed=false;if(!head||ui.editor.value!==head.content){const c=await makeCommit(ui.editor.value,'Exported document',head?.oid||'');state.commits.push(c);state.headOid=c.oid;saveState();setDirty(false);status('Changes committed for export.',c.oid);committed=true}const files=await buildRepoFiles(),zip=makeZip(files),blob=new Blob([zip],{type:'application/zip'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='git-document-repository.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast(committed?'Changes committed and repository ZIP downloaded.':'No new changes; current repository ZIP downloaded.','success')}
async function readLooseMap(files,oid){const packed=files.get('.git/objects/'+oid.slice(0,2)+'/'+oid.slice(2));if(!packed)throw new Error('Missing Git object '+oid);const full=await decompress(packed);const z=full.indexOf(0);if(z<0)throw new Error('Invalid Git object '+oid);const header=dec.decode(full.slice(0,z)),sp=header.indexOf(' '),type=header.slice(0,sp),len=Number(header.slice(sp+1)),payload=full.slice(z+1);if(payload.length!==len)throw new Error('Corrupt Git object '+oid);if(bytesToHex(await sha1(full))!==oid)throw new Error('Git object failed integrity check: '+oid);return{type,payload}}
async function importRepoMap(files){const headBytes=files.get('.git/HEAD');if(!headBytes)throw new Error('ZIP does not contain .git/HEAD.');const headText=dec.decode(headBytes).trim();let headOid='';if(headText.startsWith('ref: ')){const ref=headText.slice(5).trim(),r=files.get('.git/'+ref);if(!r)throw new Error('ZIP is missing branch reference '+ref);headOid=dec.decode(r).trim()}else headOid=headText;if(!/^[0-9a-f]{40}$/i.test(headOid))throw new Error('Could not find a valid HEAD commit.');const newest=[];let oid=headOid;const visited=new Set();while(oid&&!visited.has(oid)){visited.add(oid);const co=await readLooseMap(files,oid);if(co.type!=='commit')throw new Error('HEAD does not point to a commit.');const pc=parseCommit(co.payload),to=await readLooseMap(files,pc.tree);const entry=parseTree(to.payload).find(e=>e.name==='document.txt');if(!entry)throw new Error('A commit does not contain root document.txt.');const bo=await readLooseMap(files,entry.oid),content=dec.decode(bo.payload);newest.push({oid,parent:pc.parent,treeOid:pc.tree,blobOid:entry.oid,author:pc.author,timestamp:pc.timestamp,timezone:pc.timezone,message:pc.message,content,commitRaw:b64(co.payload),treeRaw:b64(to.payload),blobRaw:b64(bo.payload)});oid=pc.parent}const working=files.has('document.txt')?dec.decode(files.get('document.txt')):(newest[0]?.content||'');state={commits:newest.reverse(),headOid,workingText:working};ui.editor.value=working;saveState();const latest=state.commits[state.commits.length-1];setDirty(working!==latest.content);status('Repository imported successfully.',headOid);toast('Imported '+state.commits.length+' Git commit'+(state.commits.length===1?'':'s')+'.','success')}
async function importRepoZipFile(file){const bytes=new Uint8Array(await file.arrayBuffer()),files=parseZip(bytes);await importRepoMap(files)}
async function exportRepo(){if(!window.showDirectoryPicker){toast('Folder export needs Chrome, Edge, or Brave.','error');return}const parent=await window.showDirectoryPicker({mode:'readwrite'}),target=await parent.getDirectoryHandle('git-document-repository',{create:true});await clearDir(target);await writeFile(target,'document.txt',enc.encode(ui.editor.value));const gitDir=await target.getDirectoryHandle('.git',{create:true});await writeFile(gitDir,'HEAD','ref: refs/heads/main\n');await writeFile(gitDir,'config','[core]\n\trepositoryformatversion = 0\n\tfilemode = false\n\tbare = false\n\tlogallrefupdates = true\n');await writeFile(gitDir,'description','Local Git Document Editor repository\n');const seen=new Set();for(const c of state.commits){if(!seen.has(c.blobOid)){await writeLoose(gitDir,'blob',unb64(c.blobRaw),c.blobOid);seen.add(c.blobOid)}if(!seen.has(c.treeOid)){await writeLoose(gitDir,'tree',unb64(c.treeRaw),c.treeOid);seen.add(c.treeOid)}if(!seen.has(c.oid)){await writeLoose(gitDir,'commit',unb64(c.commitRaw),c.oid);seen.add(c.oid)}}const head=state.commits[state.commits.length-1];await writeFile(gitDir,'refs/heads/main',head.oid+'\n');await writeFile(gitDir,'index',await makeIndex(head.blobOid,enc.encode(head.content).length));toast('Exported a real Git repository folder.','success')}
async function readLoose(gitDir,oid){const packed=await readFile(gitDir,'objects/'+oid.slice(0,2)+'/'+oid.slice(2));const full=await decompress(packed);let z=full.indexOf(0);if(z<0)throw new Error('Invalid Git object '+oid);const header=dec.decode(full.slice(0,z)),space=header.indexOf(' '),type=header.slice(0,space),len=Number(header.slice(space+1)),payload=full.slice(z+1);if(payload.length!==len)throw new Error('Corrupt Git object '+oid);const check=await sha1(full);if(bytesToHex(check)!==oid)throw new Error('Git object failed integrity check: '+oid);return{type,payload}}
function parseTree(payload){const out=[];let i=0;while(i<payload.length){let sp=i;while(payload[sp]!==32)sp++;const mode=dec.decode(payload.slice(i,sp));let zero=sp+1;while(payload[zero]!==0)zero++;const name=dec.decode(payload.slice(sp+1,zero));const oid=bytesToHex(payload.slice(zero+1,zero+21));out.push({mode,name,oid});i=zero+21}return out}
